name: 替换

on:
  workflow_dispatch:
    inputs:
      download_link:
        description: '插件下载链接'
        required: true
      release_tag:
        description: '发行版标签'
        required: true
      release_title:
        description: '发行版标题'
        required: true

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
    - name: 初始化仓库
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 下载文件并重命名为 copilot.zip
      run:
        curl -L ${{ github.event.inputs.download_link }} -o copilot.zip

    - name: 解压 copilot.zip 到当前文件夹
      run: |
        unzip copilot.zip

    - name: 查找并解压包含 copilot-core.xml 的 jar 文件
      run: |
        # 查找包含 META-INF/copilot-core.xml 的 jar 文件
        TARGET_JAR=""
        for jar in github-copilot-intellij/lib/*.jar; do
          if unzip -l "$jar" 2>/dev/null | grep -q "META-INF/copilot-core.xml"; then
            TARGET_JAR="$jar"
            break
          fi
        done
        if [ -z "$TARGET_JAR" ]; then
          echo "错误: 找不到包含 META-INF/copilot-core.xml 的 jar 文件"
          exit 1
        fi
        echo "找到目标 jar: $TARGET_JAR"
        echo "TARGET_JAR=$TARGET_JAR" >> $GITHUB_ENV
        echo "TARGET_JAR_NAME=$(basename "$TARGET_JAR")" >> $GITHUB_ENV
        unzip "$TARGET_JAR" -d core

    - name: 运行 2.replace.py 文件
      run: |
        python3 2.replace.py

    - name: 移动 copilot.properties 文件
      run: |
        mv copilot.properties core/copilot/

    - name: 将 core 目录重新打包并替换原 jar 文件
      run: |
        cd core
        zip -r ../github-copilot-intellij/lib/${{ env.TARGET_JAR_NAME }} *

    - name: 打包为发行版文件
      run: |
        zip -r github-copilot-intellij-${{ github.event.inputs.release_tag }}.zip github-copilot-intellij

    - name: 创建 GitHub 发行版并上传文件
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag }}
        name: ${{ github.event.inputs.release_title }}
        draft: false
        make_latest: false
        files: |
          github-copilot-intellij-${{ github.event.inputs.release_tag }}.zip
